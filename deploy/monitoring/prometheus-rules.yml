groups:
  - name: lightrag-single-server
    interval: 30s
    rules:
      - alert: LightRAGMetricsCollectionErrors
        expr: sum(lightrag_metrics_collection_error) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: LightRAG metrics collection is partially failing
          description: >-
            The /metrics exporter reported collection errors. Check the scope
            label to identify whether KB catalog, documents, jobs, or audit
            metadata could not be read.

      - alert: LightRAGHighServerErrors
        expr: sum(increase(lightrag_http_requests_total{status_code=~"5.."}[5m])) > 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: LightRAG is returning HTTP 5xx responses
          description: >-
            At least one route returned a server error in the last 5 minutes.
            Inspect application logs and the route/status_code labels.

      - alert: LightRAGHighClientErrors
        expr: sum(increase(lightrag_http_requests_total{status_code=~"4.."}[15m])) > 20
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: LightRAG is returning many HTTP 4xx responses
          description: >-
            Client errors exceeded the single-server operational threshold.
            Check auth, RBAC, upload limits, idempotency conflicts, and request
            validation failures.

      - alert: LightRAGQueuedOrRunningJobsStuck
        expr: sum(lightrag_kb_jobs_total{status=~"queued|running|retrying|cancelling"}) > 0
        for: 45m
        labels:
          severity: warning
        annotations:
          summary: LightRAG has long-lived active KB jobs
          description: >-
            One or more KB jobs stayed queued/running/retrying/cancelling for
            longer than the single-server runbook threshold. Check /kbs/{kb_id}/jobs
            and worker logs before retrying or cancelling.

      - alert: LightRAGFailedJobsPresent
        expr: sum(lightrag_kb_jobs_total{status="failed"}) > 0
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: LightRAG has failed KB jobs
          description: >-
            Failed jobs are present in the metadata store. Review job details,
            retry recoverable jobs, and inspect parser/build/delete errors.

      - alert: LightRAGExporterDown
        expr: up{job=~".*lightrag.*"} == 0
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: Prometheus cannot scrape LightRAG
          description: >-
            Prometheus reports the LightRAG scrape target as down. Verify the
            single server process, network path, and /metrics authentication.
